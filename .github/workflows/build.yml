name: build

# Builds the mod on GitHub's servers (which have full internet access, unlike
# the dev sandbox) so we can verify it actually compiles on both loaders.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload mod jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: program7-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: warn

      # Stage just the two playable loader jars (drop the -sources and
      # intermediate -dev-shadow jars) so the release page is uncluttered.
      - name: Stage playable jars
        if: success() && (github.ref == 'refs/heads/claude/minecraft-fabric-mod-gb9ys2' || github.ref == 'refs/heads/claude/backlog-review-jg7xm6')
        run: |
          mkdir -p dist
          cp fabric/build/libs/*.jar neoforge/build/libs/*.jar dist/ 2>/dev/null || true
          rm -f dist/*-sources.jar dist/*-dev-shadow.jar dist/*-dev.jar
          echo "Release contents:"; ls -la dist

      # Publish/refresh a single rolling pre-release so there's always one
      # stable download link for the latest playable dev build.
      - name: Publish dev build release
        if: success() && (github.ref == 'refs/heads/claude/minecraft-fabric-mod-gb9ys2' || github.ref == 'refs/heads/claude/backlog-review-jg7xm6')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Program 7 — latest dev build
          prerelease: true
          body: |
            Automated dev build of Program 7 (Minecraft 1.21.1). Early and
            incomplete — expect placeholder art and rough balance.

            **To play (Fabric):** install Fabric Loader for 1.21.1, then drop
            `program7-fabric-*.jar` **plus Fabric API and Architectury API**
            into your mods folder.
            **To play (NeoForge):** install NeoForge for 1.21.1, then drop
            `program7-neoforge-*.jar` **plus Architectury API** into mods.

            Built from ${{ github.sha }}.
          files: dist/*.jar
